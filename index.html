<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy Start 2.0 · Prototype</title>
<style>
  :root{
    --violet:#6d46fc; --violet-2:#4221b8; --ink:#17151f; --muted:#6b6878;
    --bg:#efedf5; --panel:#fff; --line:#e6e2f0; --line-2:#efedf5;
    --shadow:0 30px 70px rgba(28,14,64,.16);
    --sb:272px; --top:60px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif;
    color:var(--ink);background:var(--bg);
    display:grid;grid-template-columns:var(--sb) 1fr;grid-template-rows:100%;height:100vh;overflow:hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .brand{padding:20px 22px 16px;border-bottom:1px solid var(--line-2)}
  .brand .logo{font-weight:800;font-size:19px;letter-spacing:.5px}
  .brand .logo b{color:var(--violet)}
  .brand .sub{margin-top:3px;font-size:12.5px;color:var(--muted)}
  .nav{padding:12px 12px 24px;overflow-y:auto;min-height:0;flex:1}
  .grp{margin:14px 8px 6px;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:#9a96a8;font-weight:700}
  .grp:first-child{margin-top:4px}
  .item{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;
    font-size:14px;font-weight:600;color:#3a3746;line-height:1.2;user-select:none;
  }
  .item:hover{background:var(--line-2)}
  .item.active{background:#efeaff;color:var(--violet-2)}
  .item .vs{margin-left:auto;display:flex;gap:3px}
  .item .vs i{width:6px;height:6px;border-radius:50%;background:#cfc9df}
  .item.active .vs i{background:var(--violet)}
  .foot{padding:14px 20px;border-top:1px solid var(--line-2);font-size:12px;color:var(--muted)}
  .foot a{color:var(--violet);text-decoration:none;font-weight:600}

  /* ---------- Top bar ---------- */
  .main{min-width:0;min-height:0;display:flex;flex-direction:column}
  .topbar{
    height:var(--top);flex:0 0 var(--top);display:flex;align-items:center;gap:16px;
    padding:0 22px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  .topbar .title{font-size:16px;font-weight:700}
  .topbar .native{font-size:12px;color:var(--muted);padding:3px 9px;background:var(--line-2);border-radius:20px;font-weight:600}
  .seg{margin-left:auto;display:flex;background:var(--line-2);border-radius:10px;padding:3px}
  .seg button{
    border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;color:#57536a;
    padding:6px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:7px;
  }
  .seg button svg{width:15px;height:15px;opacity:.8}
  .seg button[aria-selected="true"]{background:var(--panel);color:var(--violet-2);box-shadow:0 1px 3px rgba(30,15,70,.12)}
  .seg button:disabled{opacity:.3;cursor:not-allowed}
  .hamb{display:none;border:0;background:transparent;cursor:pointer;padding:6px;margin-left:-6px}
  .hamb svg{width:22px;height:22px}

  /* ---------- Stage ---------- */
  .stage{flex:1;min-height:0;overflow:auto;display:grid;place-items:start center;padding:36px 28px 60px}
  .frame{margin:auto}

  /* Desktop browser chrome */
  .browser{width:min(100%,var(--w,1280px));background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .browser .bar{height:44px;display:flex;align-items:center;gap:12px;padding:0 15px;background:#f4f2f7;border-bottom:1px solid var(--line)}
  .browser .dots{display:flex;gap:7px}
  .browser .dots i{width:11px;height:11px;border-radius:50%;display:block}
  .browser .dots i:nth-child(1){background:#ff5f57}
  .browser .dots i:nth-child(2){background:#febc2e}
  .browser .dots i:nth-child(3){background:#28c840}
  .browser .url{flex:1;max-width:440px;height:27px;display:flex;align-items:center;gap:7px;padding:0 12px;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:12px;color:#8b8798;white-space:nowrap;overflow:hidden}
  .browser .url svg{width:12px;height:12px;flex:0 0 auto}
  .scr{overflow:auto;max-height:calc(100vh - var(--top) - 150px);background:#fff}
  .scr img{width:100%;display:block}

  /* Phone / tablet bezels */
  .device{background:#0d0d12;box-shadow:var(--shadow);position:relative}
  .device.mobile{border-radius:46px;padding:13px}
  .device.mobile .scr{width:375px;border-radius:34px;max-height:min(780px,calc(100vh - var(--top) - 150px))}
  .device.tablet{border-radius:32px;padding:16px}
  .device.tablet .scr{width:768px;border-radius:16px;max-height:min(900px,calc(100vh - var(--top) - 150px))}
  .device .notch{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:130px;height:24px;background:#0d0d12;border-radius:0 0 16px 16px;z-index:2}

  .hint{text-align:center;color:var(--muted);font-size:12.5px;margin:16px 0 0;width:100%}

  /* ---------- Responsive shell ---------- */
  .scrim{display:none}
  @media (max-width:900px){
    body{grid-template-columns:1fr}
    .sidebar{position:fixed;z-index:40;width:var(--sb);height:100%;transform:translateX(-100%);transition:transform .22s ease}
    body.nav-open .sidebar{transform:none}
    .scrim{display:block;position:fixed;inset:0;background:rgba(20,10,40,.35);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
    body.nav-open .scrim{opacity:1;pointer-events:auto}
    .hamb{display:inline-flex}
    .device.tablet .scr{width:min(768px,86vw)}
    .device.mobile .scr{width:min(375px,82vw)}
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">NOV<b>&#9650;</b>KID</div>
      <div class="sub">Easy Start 2.0 · Sprint 149 · Prototype</div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">1:1 exports from Figma · <a href="https://www.figma.com/design/gr1tIS4ZlCL165TZU2iYH1/Easy-Start" target="_blank" rel="noopener">Open source file</a></div>
  </aside>

  <div class="scrim" onclick="document.body.classList.remove('nav-open')"></div>

  <main class="main">
    <div class="topbar">
      <button class="hamb" aria-label="Menu" onclick="document.body.classList.toggle('nav-open')">
        <svg viewBox="0 0 24 24" fill="none" stroke="#17151f" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="title" id="title">Dashboard</div>
      <span class="native" id="native">1280 × 1897</span>
      <div class="seg" id="seg" role="tablist">
        <button data-v="desktop" role="tab" onclick="setView('desktop')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M9 20h6M12 17v3"/></svg>Desktop</button>
        <button data-v="tablet" role="tab" onclick="setView('tablet')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="2.5" width="14" height="19" rx="2.2"/><path d="M11 18.5h2"/></svg>Tablet</button>
        <button data-v="mobile" role="tab" onclick="setView('mobile')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="7" y="2.5" width="10" height="19" rx="2.4"/><path d="M11 18.5h2"/></svg>Mobile</button>
      </div>
    </div>
    <div class="stage" id="stage"></div>
  </main>

<script>
const SCREENS = [
  {key:'dashboard',    name:'Dashboard',            group:'Home',       v:{desktop:'dashboard-desktop.png',    tablet:'dashboard-tablet.png',    mobile:'dashboard-mobile.png'},    n:{desktop:'1280 × 1897',tablet:'768 × 2670',mobile:'375 × 3072'}, w:{desktop:1280,tablet:768,mobile:375}},
  {key:'afterpurchase',name:'After purchase',       group:'Onboarding', v:{desktop:'afterpurchase-desktop.png',tablet:'afterpurchase-tablet.png',mobile:'afterpurchase-mobile.png'},n:{desktop:'1280 × 798',tablet:'768 × 977',mobile:'375 × 867'}, w:{desktop:1280,tablet:768,mobile:375}},
  {key:'appdownload',  name:'App download',         group:'Onboarding', v:{desktop:'appdownload-desktop.png',  tablet:'appdownload-tablet.png',  mobile:'appdownload-mobile.png'},  n:{desktop:'1440 × 795',tablet:'768 × 1018',mobile:'375 × 812'}, w:{desktop:1440,tablet:768,mobile:375}},
  {key:'schedule',     name:'Schedule',             group:'Scheduling', v:{desktop:'schedule-desktop.png',                                       mobile:'schedule-mobile.png'},     n:{desktop:'1280 × 844',mobile:'375 × 844'}, w:{desktop:1280,mobile:375}},
  {key:'schedule-mu',  name:'Schedule · Multiple kids',group:'Scheduling',v:{desktop:'schedule-mu-desktop.png',                                   mobile:'schedule-mu-mobile.png'},  n:{desktop:'1280 × 844',mobile:'375 × 844'}, w:{desktop:1280,mobile:375}},
  {key:'booking',      name:'Booking lesson',       group:'Scheduling', v:{desktop:'booking-desktop.png',                                        mobile:'booking-mobile.png'},      n:{desktop:'1280 × 1133',mobile:'375 × 1310'}, w:{desktop:1280,mobile:375}},
  {key:'speaking',     name:'Speaking practice',    group:'Scheduling', v:{desktop:'speaking-desktop.png',     tablet:'speaking-tablet.png',     mobile:'speaking-mobile.png'},     n:{desktop:'1280 × 900',tablet:'768 × 900',mobile:'375 × 812'}, w:{desktop:1280,tablet:768,mobile:375}},
  {key:'timezone',     name:'Time zone popup',      group:'Other',      v:{desktop:'timezone-desktop.png'},                                                                          n:{desktop:'1779 × 948'}, w:{desktop:1779}},
];
const ROUTE_ALIAS = {home:'dashboard', '':'dashboard'};
const VIEWS = ['desktop','tablet','mobile'];
let cur = {key:'dashboard', view:'desktop'};

function byKey(k){return SCREENS.find(s=>s.key===k)}
function views(s){return VIEWS.filter(v=>s.v[v])}

function renderNav(){
  const nav=document.getElementById('nav'); nav.innerHTML='';
  let g=null;
  SCREENS.forEach(s=>{
    if(s.group!==g){g=s.group; const h=document.createElement('div');h.className='grp';h.textContent=g;nav.appendChild(h);}
    const el=document.createElement('div');
    el.className='item'+(s.key===cur.key?' active':'');
    el.onclick=()=>{location.hash='#/'+s.key; document.body.classList.remove('nav-open');};
    const dots=views(s).map(()=>'<i></i>').join('');
    el.innerHTML='<span>'+s.name+'</span><span class="vs">'+dots+'</span>';
    nav.appendChild(el);
  });
}

function render(){
  const s=byKey(cur.key); if(!s) return;
  const av=views(s);
  if(!av.includes(cur.view)) cur.view = av.includes('desktop')?'desktop':av[0];
  const view=cur.view;

  document.getElementById('title').textContent=s.name;
  document.getElementById('native').textContent=s.n[view]||'';
  document.querySelectorAll('.seg button').forEach(b=>{
    const v=b.dataset.v; b.disabled=!s.v[v]; b.setAttribute('aria-selected', String(v===view));
  });
  renderNav();

  const stage=document.getElementById('stage');
  const src='screens/'+s.v[view];
  let html='';
  if(view==='desktop'){
    html='<div class="frame"><div class="browser" style="--w:'+s.w.desktop+'px">'
      +'<div class="bar"><div class="dots"><i></i><i></i><i></i></div>'
      +'<div class="url"><svg viewBox="0 0 24 24" fill="none" stroke="#8b8798" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>school.novakidschool.com/parent/easystart</div></div>'
      +'<div class="scr"><img src="'+src+'" alt="'+s.name+' — desktop"></div></div></div>';
  } else if(view==='tablet'){
    html='<div class="frame"><div class="device tablet"><div class="scr"><img src="'+src+'" alt="'+s.name+' — tablet"></div></div></div>';
  } else {
    html='<div class="frame"><div class="device mobile"><div class="notch"></div><div class="scr"><img src="'+src+'" alt="'+s.name+' — mobile"></div></div></div>';
  }
  html+='<div class="hint">'+s.name+' · '+view+' · '+(s.n[view]||'')+' · scroll inside the frame</div>';
  stage.innerHTML=html;
  stage.scrollTop=0;
}

function setView(v){ const s=byKey(cur.key); if(!s||!s.v[v])return; cur.view=v; render(); }

function fromHash(){
  const raw=(location.hash||'').replace(/^#\/?/,'').split(/[\/?]/)[0];
  const key=ROUTE_ALIAS[raw]!==undefined?ROUTE_ALIAS[raw]:raw;
  cur.key = byKey(key)?key:'dashboard';
  render();
}
window.addEventListener('hashchange',fromHash);
renderNav();
fromHash();
</script>
</body>
</html>
